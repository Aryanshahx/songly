name: Android APK

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Write dart_define.json from repo secrets
        run: |
          cat > dart_define.json <<JSON
          {
            "YT_API_KEY": "${{ secrets.YT_API_KEY }}",
            "MB_CONTACT": "${{ secrets.MB_CONTACT }}",
            "APP_VERSION": "1.0.0"
          }
          JSON

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build debug APK
        run: flutter build apk --debug --dart-define-from-file=dart_define.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: songly-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
